<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightloop · Subscription billing that never misses a renewal</title>
  <meta name="description" content="Brightloop manages plans, subscriptions, invoices and payments in one place, so every renewal is billed on time.">
  <meta name="theme-color" content="#c1291d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23c1291d' stroke-width='5' stroke-dasharray='58 12' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23e0680f'/%3E%3C/svg%3E">
  <!-- Apply the saved theme before first paint so there is no flash. Falls back to the OS setting. -->
  <script>try{var t=localStorage.getItem('bl_theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Brightloop needs JavaScript to run.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
